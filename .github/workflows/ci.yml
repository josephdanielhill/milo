name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      # vite.config.ts unconditionally imports ./.openai/hosting.json (gitignored,
      # per-environment). An empty object is enough while D1/R2 stay unused — see
      # .gitignore and docs/ARCHITECTURE.md.
      - run: mkdir -p .openai && echo '{}' > .openai/hosting.json
      - run: npm test
